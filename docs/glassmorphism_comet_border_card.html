<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comet Border Glass Card</title>
  <style>
    /* 画面全体のスタイル（背景の透け感を確認するためのグラデーション背景） */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* メインコンテナ */
    .card-container {
      position: relative;
      width: 400px;
      height: 100px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    /* ベースとなる枠線（静的な薄い枠線） */
    .border-base {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      pointer-events: none;
      box-sizing: border-box;
      z-index: 2;
    }

    /* 枠線上を周回するアニメーション */
    @keyframes moveAlongBorder {
      0% {
        offset-distance: 0%;
      }
      100% {
        offset-distance: 100%;
      }
    }

    /* 鈍く点滅（明滅）するアニメーション */
    @keyframes pulseOpacity {
      0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.4));
      }
      50% {
        opacity: 0.25;
        filter: drop-shadow(0 0 0px rgba(0, 0, 0, 0));
      }
    }

    /* 枠線上を周回する彗星要素共通スタイル */
    .comet-dot {
      position: absolute;
      width: 60px; /* 彗星全体の長さ（尾の部分含む） */
      height: 2px; /* 枠線の太さに合わせる */
      
      /* 彗星のグラデーション（右端が黒い先端、左に向かって透明になる尾） */
      background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.4) 60%, #000000 100%);
      border-radius: 2px;

      /* 角丸長方形の枠線（2px位置）を移動パスとして設定 */
      offset-path: rect(0px auto auto 0px round 16px);
      offset-rotate: auto; /* パスの接線方向に合わせて要素を自動回転 */

      /* アニメーションの適用：周回（4秒）と鈍い点滅（2.5秒周期でゆったり明滅） */
      animation: 
        moveAlongBorder 4s linear infinite,
        pulseOpacity 2.5s ease-in-out infinite;
      
      pointer-events: none;
      z-index: 3;
    }

    /* 2つ目の彗星：全体の半周期分（2秒）ディレイさせて対角に配置 */
    .comet-dot-2 {
      animation-delay: -2s, -0.75s; /* 周回ディレイ, 点滅周期のずらし */
    }

    /* 彗星の先端に輝き/点をつける擬似要素 */
    .comet-dot::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 5px;
      background-color: #000000;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }

    /* すりガラスカード本体 */
    .glass-card {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border-radius: 16px;
      
      /* 白いすりガラス効果（Glassmorphism） */
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      /* 内側の立体感・シャドウ */
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);

      /* コンテンツ配置 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #1a1a1a;
      text-align: center;
      z-index: 1;
    }

    .glass-card h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .glass-card p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: #333333;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- メインカード構造 -->
  <div class="card-container">
    <!-- 薄い下地枠線 -->
    <div class="border-base"></div>
    
    <!-- 枠線上を周回する彗星点（1つ目） -->
    <div class="comet-dot"></div>

    <!-- 枠線上を周回する彗星点（2つ目） -->
    <div class="comet-dot comet-dot-2"></div>
    
    <!-- ガラスカード本文 -->
    <div class="glass-card">
      <h2>Glassmorphism Card</h2>
      <p>Comet border animation effect</p>
    </div>
  </div>

</body>
</html>
